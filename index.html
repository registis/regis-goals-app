// Calcul dynamique de la semaine courante (lundi → dimanche)
const getCurrentWeek = () => {
  const today = new Date();
  const dow   = today.getDay();
  const diff  = (dow === 0) ? -6 : 1 - dow;
  const monday = new Date(today);
  monday.setDate(today.getDate() + diff);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
};

const getPct = (g) => {
  if (g.tgt === 0) return 100;
  if (g.inv) return Math.min(100, Math.max(0, ((78 - g.cur) / (78 - g.tgt)) * 100));
  return Math.min(100, (g.cur / g.tgt) * 100);
};

// Score global pondéré — calculé depuis les 24 objectifs
const calcScore = (goals) => {
  const totalPond  = goals.reduce((s, g) => s + g.pond, 0);
  if (totalPond === 0) return 0;
  const weightedSum = goals.reduce((s, g) => s + getPct(g) * g.pond, 0);
  return Math.round(weightedSum / totalPond);
};

// Couleur du score global

  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};

        <div style={{ fontSize:14, color:'rgba(255,255,255,0.74)', lineHeight:1.5, marginBottom:16 }}>
          Une home plus visuelle, plus propre et plus orientée priorités que la version initiale.
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:12 }}>
          <Card style={{ padding:16, gridColumn:'span 2', background:'var(--paper-strong)' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
              <span style={{ fontSize:12, fontWeight:800, color:'var(--muted)', letterSpacing:'0.12em', textTransform:'uppercase' }}>Score annuel</span>
              <span style={{ fontSize:28, fontWeight:800, color: gColor }}>{globalScore}%</span>
            </div>
            <Bar pct={globalScore} color={gColor} h={8} />
            <div style={{ fontSize:12, color:'var(--muted)', marginTop:8 }}>
              Trajectoire globale 2026 avec routines, patrimoine et objectifs structurants.
            </div>
          </Card>
          <Card style={{ padding:16, background:'var(--coral)' }}>
            <div style={{ fontSize:11, color:'#8f5b4c', fontWeight:800, letterSpacing:'0.12em', textTransform:'uppercase' }}>Routines</div>
            <div style={{ fontSize:28, fontWeight:800, color:'#8a4338', margin:'4px 0' }}>{done}/{habits.length}</div>
            <div style={{ fontSize:12, color:'#8f5b4c' }}>{pct}% complété</div>
          </Card>
          <Card style={{ padding:16, background:'var(--mint)' }}>
            <div style={{ fontSize:11, color:'#3b6a62', fontWeight:800, letterSpacing:'0.12em', textTransform:'uppercase' }}>Focus</div>
            <div style={{ fontSize:28, fontWeight:800, color:'var(--teal)', margin:'4px 0' }}>{topGoals.length}</div>
            <div style={{ fontSize:12, color:'#3b6a62' }}>objectifs majeurs suivis</div>
          </Card>
        </div>
        <Card style={{ padding:16, border:'1px solid rgba(255,255,255,0.72)', background:'rgba(255,255,255,0.76)' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
            <span style={{ fontSize:14, fontWeight:700, color:'var(--ink)' }}>Routines du jour</span>
            <span style={{ fontSize:22, fontWeight:800, color: pct===100?'#2ecc71':'var(--sky)' }}>{done}/{habits.length}</span>
          </div>
          <Bar pct={pct} color={pct===100?'#2ecc71':'#58a6ff'} h={8} />
          <div style={{ fontSize:12, color:'var(--muted)', marginTop:6 }}>
            {pct}% complété — Score annuel actuel : <b style={{color: gColor}}>{globalScore}%</b>
          </div>
        </Card>
        <div style={{ display:'flex', gap:8, marginTop:12, flexWrap:'wrap' }}>
          <button onClick={()=>onExport('json')} style={{ background:'rgba(255,255,255,0.16)', color:'#fff', border:'1px solid rgba(255,255,255,0.16)', borderRadius:999, padding:'8px 12px', cursor:'pointer', fontSize:12, fontWeight:700 }}>Export JSON</button>
          <button onClick={()=>onExport('csv')} style={{ background:'rgba(255,255,255,0.16)', color:'#fff', border:'1px solid rgba(255,255,255,0.16)', borderRadius:999, padding:'8px 12px', cursor:'pointer', fontSize:12, fontWeight:700 }}>Export CSV</button>
          <button onClick={()=>onExport('xls')} style={{ background:'rgba(255,255,255,0.16)', color:'#fff', border:'1px solid rgba(255,255,255,0.16)', borderRadius:999, padding:'8px 12px', cursor:'pointer', fontSize:12, fontWeight:700 }}>Export Excel</button>
        </div>
      </div>

      <div style={{ padding:'16px 20px' }}>
        {/* Habitudes */}
        <SectionTitle>🌅 Habitudes quotidiennes</SectionTitle>
        {habits.map(h => (
          <div key={h.id} onClick={()=>toggleHabit(h.id)} style={{
            display:'flex', alignItems:'center', gap:12,
            background: h.done?'#0d2a1e':'#161b22',
            border:`1px solid ${h.done?'#2ea043':'#30363d'}`,
            borderRadius:12, padding:'13px 14px', marginBottom:8, cursor:'pointer', transition:'all 0.2s'
          }}>
            <div style={{
              width:26, height:26, borderRadius:'50%',
              background: h.done?'#2ea043':'#21262d',
              border:`2px solid ${h.done?'#2ea043':'#30363d'}`,
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:13, color:'#fff', flexShrink:0, transition:'all 0.2s'
            }}>{h.done?'✓':''}</div>
            <span style={{ fontSize:22 }}>{h.icon}</span>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:14, fontWeight:600, color: h.done?'#2ecc71':'#f0f0f0', textDecoration: h.done?'line-through':'none' }}>{h.name}</div>
              <div style={{ fontSize:11, color:'#8b949e' }}>{h.cat} · 🔥 Streak : {h.streak} jours</div>
            </div>
          </div>
        ))}

        {/* Urgences */}
        <div style={{ marginTop:20 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
            <SectionTitle color='#e74c3c'>⚠️ Urgences Q1</SectionTitle>
            {visibleUrgent.length < URGENT_TASKS.length && (
              <span style={{ fontSize:11, color:'#2ecc71', fontWeight:600 }}>
                ✓ {URGENT_TASKS.length - visibleUrgent.length} réglée(s)
              </span>
            )}
          </div>

          {visibleUrgent.length === 0 ? (
            <div style={{
              textAlign:'center', padding:'20px', background:'#0d2a1e',
              border:'1px solid #2ea043', borderRadius:12,
            }}>
              <div style={{ fontSize:28, marginBottom:6 }}>🎉</div>
              <div style={{ fontSize:14, color:'#2ecc71', fontWeight:600 }}>Toutes les urgences sont réglées !</div>
            </div>
          ) : (
            visibleUrgent.map(u => {
              const linkedGoal = u.goalId ? goals.find(g => g.id === u.goalId) : null;
              const linkedPct  = linkedGoal ? getPct(linkedGoal) : null;
              return (
                <div key={u.id} style={{
                  display:'flex', alignItems:'center', gap:10,
                  background:'#161b22', borderLeft:`3px solid ${u.color}`,
                  borderRadius:'0 10px 10px 0', padding:'10px 14px', marginBottom:6,
                  cursor:'pointer', transition:'all 0.2s',
                  opacity: urgentDone.has(u.id) ? 0.4 : 1
                }}>
                  {/* Checkbox manuel */}
                  <button onClick={()=>toggleUrgent(u.id)} style={{
                    width:22, height:22, borderRadius:6, flexShrink:0,
                    background: urgentDone.has(u.id)?'#2ea043':'#21262d',
                    border:`2px solid ${urgentDone.has(u.id)?'#2ea043':'#30363d'}`,
                    cursor:'pointer', color:'#fff', fontSize:12,
                    display:'flex', alignItems:'center', justifyContent:'center'
                  }}>{urgentDone.has(u.id)?'✓':''}</button>

                  <span style={{ fontSize:18 }}>{u.icon}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, color:'#d0d0d0' }}>{u.text}</div>
                    <div style={{ display:'flex', gap:8, alignItems:'center', marginTop:3 }}>
                      <span style={{ fontSize:10, color:CATS[u.cat]?.color||'#888' }}>{u.cat}</span>
                      {linkedGoal && (
                        <span style={{ fontSize:10, color:'#8b949e' }}>
                          · Objectif lié : {linkedPct.toFixed(0)}%
                        </span>
                      )}
                    </div>
                  </div>
                  <div style={{ fontSize:11, color:'#8b949e' }}>Tap ✓</div>
                </div>
              );
            })
          )}
        </div>

        {/* Métriques clés */}
        <div style={{ marginTop:20 }}>
          <SectionTitle>📊 Métriques clés</SectionTitle>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            {[
              { label:'Capital Trading', val: tradingVal,        sub:'→ 50 718 CHF',  pct: tradingPct, color:'#1abc9c' },
              { label:'Patrimoine',      val: patriVal,          sub:'→ 400K CHF',    pct: patriPct,   color:'#9b59b6' },
              { label:'Squash rang',     val: squashVal,         sub:'→ TOP 50',      pct:0,           color:'#3498db', bar:false },
              { label:'Score annuel',    val:`${globalScore}%`,  sub:'objectif 95%',  pct:globalScore, color: gColor   },
            ].map((m,i)=>(
              <Card key={i} style={{ padding:14 }}>
                <div style={{ fontSize:11, color:'#8b949e', marginBottom:4 }}>{m.label}</div>
                <div style={{ fontSize:24, fontWeight:700, color:m.color, marginBottom:2 }}>{m.val}</div>
                <div style={{ fontSize:11, color:'#666', marginBottom:8 }}>{m.sub}</div>
                {m.bar!==false && <Bar pct={m.pct} color={m.color} h={4} />}
              </Card>
            ))}
          </div>
        </div>

        {/* Top priorités */}
        <div style={{ marginTop:20 }}>
          <SectionTitle>🔥 Top priorités 2026</SectionTitle>
          {topGoals.map(g => {
            const p = getPct(g), c = pctColor(p);
            return (
              <Card key={g.id} style={{ padding:'12px 14px', marginBottom:8 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                  <div>
                    <span style={{ fontSize:11, color:CATS[g.cat]?.color||'#aaa', fontWeight:600 }}>{CATS[g.cat]?.emoji} {g.cat}</span>
                    <div style={{ fontSize:13, fontWeight:600, color:'#f0f0f0' }}>{g.name}</div>
                  </div>
                  <span style={{ fontSize:18, fontWeight:700, color:c }}>{p.toFixed(0)}%</span>
                </div>
                <Bar pct={p} color={c} h={5} />
              </Card>
            );
          })}
        </div>
      </div>
    </div>
  );
};

// GOALS TAB
// ═══════════════════════════════════════════════════════
const GoalsTab = ({ goals, setGoals, goalNotes, setGoalNotes }) => {
  const [catFilter, setCatFilter] = useState('Tous');
  const [editing,   setEditing]   = useState(null);
  const [editVal,   setEditVal]   = useState('');
  const [voiceActive, setVoice]   = useState(false);
  const [note,      setNote]      = useState('');
  const [editingNote, setEditingNote] = useState(null);
  const globalScore = calcScore(goals);
  const gColor      = scoreColor(globalScore);

  const cats     = ['Tous', ...Object.keys(CATS).filter(c => goals.some(g=>g.cat===c))];
  const filtered = catFilter==='Tous' ? goals : goals.filter(g=>g.cat===catFilter);

  const save = (id) => {
    const v = parseFloat(editVal);
    if (!isNaN(v)) setGoals(prev=>prev.map(g=>g.id===id?{...g,cur:v}:g));
    setEditing(null);
  };

  const startVoice = () => {
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
      alert('La reconnaissance vocale n\'est pas disponible sur ce navigateur. Utilisez Chrome ou Safari.');
      return;
    }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.lang = 'fr-FR'; r.interimResults = false;
    setVoice(true);
    r.onresult = (e) => {
      const t = e.results[0][0].transcript;
      setNote(t);
      setVoice(false);
      const nums = t.match(/\d+(?:[.,]\d+)?/g);
      if (nums && editing) setEditVal(nums[0].replace(',','.'));
    };
    r.onerror = () => setVoice(false);
    r.onend   = () => setVoice(false);
    r.start();
  };

  return (
    <div className="slide-up">
      <TabHeader title="🎯 Objectifs 2026" sub={`${goals.length} objectifs · Score global`} extra={
        <div style={{ marginTop:10, display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ flex:1 }}>
            <div style={{ background:'#21262d', borderRadius:999, height:8, overflow:'hidden' }}>
              <div style={{ background:`linear-gradient(90deg,${gColor},${gColor}bb)`, width:`${globalScore}%`, height:'100%', borderRadius:999, transition:'width 0.8s ease' }} />
            </div>
          </div>
          <span style={{ fontSize:22, fontWeight:800, color: gColor, minWidth:48, textAlign:'right' }}>{globalScore}%</span>
        </div>
      } />
      <div style={{ overflowX:'auto', padding:'12px 20px 8px', display:'flex', gap:8 }}>
        {cats.map(c=><Chip key={c} label={c} active={catFilter===c} onClick={()=>setCatFilter(c)} />)}
      </div>
      {voiceActive && (
        <div style={{ margin:'0 20px 10px', background:'#0d2a3e', border:'1px solid #58a6ff', borderRadius:12, padding:'12px 16px', display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:10, height:10, borderRadius:'50%', background:'#e74c3c', animation:'pulse 1s infinite' }} />
          <span style={{ fontSize:13, color:'#58a6ff' }}>🎤 Écoute en cours… Dites le nouveau chiffre</span>
        </div>
      )}
      {note && <div style={{ margin:'0 20px 10px', background:'#0d2a1e', borderRadius:10, padding:'10px 14px', fontSize:12, color:'#2ecc71' }}>📝 Reconnu : "{note}"</div>}
      <div style={{ padding:'0 20px 20px' }}>
        {filtered.sort((a,b)=>b.pond-a.pond).map(g=>{
          const p=getPct(g), c=pctColor(p), isE=editing===g.id;
          const noteValue = goalNotes[g.id] || '';
          const isEditingNote = editingNote === g.id;
          return (
            <Card key={g.id} style={{ padding:16, marginBottom:10, border:`1px solid ${isE?'#58a6ff':'#30363d'}` }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:10 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:11, color:CATS[g.cat]?.color||'#aaa', fontWeight:600, marginBottom:2 }}>{CATS[g.cat]?.emoji} {g.cat}</div>
                  <div style={{ fontSize:15, fontWeight:600 }}>{g.name}</div>
                </div>
                <div style={{ display:'flex', gap:6, flexShrink:0 }}>
                  <span style={{ fontSize:10, background:'#21262d', color:'#8b949e', padding:'3px 8px', borderRadius:6 }}>{g.trim}</span>
                  <span style={{ fontSize:10, background:`${CATS[g.cat]?.bg||'#21262d'}`, color:CATS[g.cat]?.color||'#f39c12', padding:'3px 8px', borderRadius:6 }}>★{g.pond}</span>
                </div>
              </div>
              <Bar pct={p} color={c} h={6} />
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:8 }}>
                <div>
                  <span style={{ fontSize:18, fontWeight:700, color:c }}>{p.toFixed(0)}%</span>
                  <span style={{ fontSize:11, color:'#8b949e', marginLeft:8 }}>{g.cur} / {g.tgt} {g.unit}</span>
                </div>
                {isE ? (
                  <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                    <button onClick={startVoice} title="Mise à jour vocale" style={{ background:'#1a3a5c', border:'1px solid #58a6ff', color:'#58a6ff', borderRadius:8, padding:'5px 8px', cursor:'pointer', fontSize:14 }}>🎤</button>
                    <input type="number" value={editVal} onChange={e=>setEditVal(e.target.value)}
                      onKeyDown={e=>e.key==='Enter'&&save(g.id)}
                      style={{ width:80, background:'#0d1117', border:'1px solid #58a6ff', borderRadius:8, padding:'5px 8px', color:'#f0f0f0', fontSize:13 }} autoFocus />
                    <button onClick={()=>save(g.id)} style={{ background:'#2ea043', color:'#fff', border:'none', borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:13 }}>✓</button>
                    <button onClick={()=>setEditing(null)} style={{ background:'#21262d', color:'#8b949e', border:'none', borderRadius:8, padding:'5px 10px', cursor:'pointer', fontSize:13 }}>✕</button>
                  </div>
                ) : (
                  <button onClick={()=>{setEditing(g.id);setEditVal(String(g.cur));setNote('');}} style={{
                    background:'#21262d', color:'#8b949e', border:'1px solid #30363d',
                    borderRadius:8, padding:'5px 12px', cursor:'pointer', fontSize:12,
                    display:'flex', alignItems:'center', gap:4
                  }}>✏️ Mettre à jour</button>
                )}
              </div>
              <div style={{ marginTop:12, paddingTop:12, borderTop:'1px solid rgba(31,42,56,0.08)' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                  <span style={{ fontSize:11, color:'#8b949e', fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase' }}>Notes</span>
                  <button onClick={()=>setEditingNote(isEditingNote ? null : g.id)} style={{
                    background:'rgba(31,42,56,0.06)', color:'#687385', border:'1px solid rgba(31,42,56,0.08)',
                    borderRadius:999, padding:'5px 10px', cursor:'pointer', fontSize:11, fontWeight:700
                  }}>{isEditingNote ? 'Fermer' : (noteValue ? 'Modifier' : 'Ajouter')}</button>
                </div>
                {noteValue && !isEditingNote && (
                  <div style={{ whiteSpace:'pre-wrap', fontSize:12, lineHeight:1.5, color:'#334155', background:'rgba(255,255,255,0.65)', border:'1px solid rgba(31,42,56,0.08)', borderRadius:10, padding:'10px 12px' }}>
                    {noteValue}
                  </div>
                )}
                {isEditingNote && (
                  <textarea
                    value={noteValue}
                    onChange={(e)=>setGoalNotes(prev => ({ ...prev, [g.id]: e.target.value }))}
                    placeholder="Ex : liste des livres lus, idées, détails, prochaines étapes..."
                    style={{
                      width:'100%', minHeight:110, resize:'vertical', background:'rgba(255,255,255,0.88)',
                      border:'1px solid rgba(31,42,56,0.12)', borderRadius:10, padding:'10px 12px',
                      color:'#1f2a38', fontSize:13, lineHeight:1.5
                    }}
                  />
                )}
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
};

// SENTINELLE TAB
// ═══════════════════════════════════════════════════════
const SentinelTab = ({ interests, setInterests, onAddToAgenda, eventsDb, eventsSource }) => {
  const [scanning,    setScanning]    = useState(false);
  const [lastScan,    setLastScan]    = useState("Aujourd'hui à 06:00");
  const [newInterest, setNewInterest] = useState('');
  const [showAdd,     setShowAdd]     = useState(false);

  // Filtrer les événements passés + calcul dynamique "hot" (≤ 7 jours)
  const todayStart = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
  const daysFromNow = (dateStr) => Math.round((new Date(dateStr).setHours(0,0,0,0) - todayStart.getTime()) / 86400000);
  const active   = interests.filter(i=>i.active).map(i=>i.id);
  const filtered = eventsDb.filter(e => active.includes(e.int) && daysFromNow(e.date) >= 0);
  const hot      = filtered.filter(e => daysFromNow(e.date) <= 7);
  const rest     = filtered.filter(e => daysFromNow(e.date) > 7);

  const toggleInt = (id) => setInterests(prev=>prev.map(i=>i.id===id?{...i,active:!i.active}:i));
  const scan = () => { setScanning(true); setTimeout(()=>{ setScanning(false); setLastScan('À l\'instant'); }, 2200); };

  const addCustomInterest = () => {
    if (newInterest.trim()) {
      setInterests(prev=>[...prev,{id:`custom_${Date.now()}`,name:newInterest.trim(),icon:'⭐',active:true}]);
      setNewInterest(''); setShowAdd(false);
    }
  };

  return (
    <div className="slide-up">
      <div style={{ background:'linear-gradient(135deg,#0d1b2a,#1a1a2e)', padding:'28px 20px 16px' }}>
        <div style={{ fontSize:28, fontWeight:700, marginBottom:4 }}>🔭 Sentinelle</div>
        <div style={{ fontSize:13, color:'#8b949e', marginBottom:12 }}>
          Dernier scan : {lastScan} · {filtered.length} événements trouvés
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
          <div style={{ display:'inline-flex', alignItems:'center', gap:8, background:'#0d2a1e', border:'1px solid #2ea043', borderRadius:999, padding:'6px 14px' }}>
            <div style={{ width:8, height:8, borderRadius:'50%', background:'#2ecc71', animation:'pulse 2s infinite' }} />
            <span style={{ fontSize:12, color:'#2ecc71', fontWeight:600 }}>Active — Scan quotidien 06h00</span>
          </div>
          <button onClick={scan} style={{
            background: scanning?'#21262d':'#0d2a3e', border:'1px solid #58a6ff', color:'#58a6ff',
            borderRadius:999, padding:'6px 16px', cursor:'pointer', fontSize:12, fontWeight:600,
            display:'flex', alignItems:'center', gap:6
          }}>
            <span style={{ display:'inline-block', animation: scanning?'spin 1s linear infinite':'none' }}>🔄</span>
            {scanning?'Scan en cours…':'Scanner maintenant'}
          </button>
          <div style={{
            display:'inline-flex', alignItems:'center', gap:6, padding:'6px 12px', borderRadius:999,
            background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.14)',
            color:'rgba(255,255,255,0.78)', fontSize:11, fontWeight:700
          }}>
            Source: {eventsSource}
          </div>
        </div>
      </div>

      <div style={{ padding:'16px 20px' }}>
        <SectionTitle>Mes centres d'intérêt</SectionTitle>
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:16 }}>
          {interests.map(i=>(
            <button key={i.id} onClick={()=>toggleInt(i.id)} style={{
              display:'flex', alignItems:'center', gap:6, padding:'7px 13px',
              borderRadius:999, border:`1px solid ${i.active?'#2ea043':'#30363d'}`,
              background: i.active?'#0d2a1e':'#21262d', color: i.active?'#2ecc71':'#8b949e',
              fontSize:12, fontWeight:600, cursor:'pointer', transition:'all 0.2s'
            }}>
              <span>{i.icon}</span><span>{i.name}</span>
            </button>
          ))}
          <button onClick={()=>setShowAdd(v=>!v)} style={{
            display:'flex', alignItems:'center', gap:4, padding:'7px 13px',
            borderRadius:999, border:'1px dashed #30363d', background:'transparent',
            color:'#8b949e', fontSize:12, cursor:'pointer'
          }}>+ Ajouter</button>
        </div>
        {showAdd && (
          <div style={{ display:'flex', gap:8, marginBottom:16 }}>
            <input value={newInterest} onChange={e=>setNewInterest(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addCustomInterest()}
              placeholder="Ex : Jazz, Peinture, Tennis…"
              style={{ flex:1, background:'#161b22', border:'1px solid #58a6ff', borderRadius:10, padding:'8px 12px', color:'#f0f0f0', fontSize:13 }} />
            <button onClick={addCustomInterest} style={{ background:'#58a6ff', color:'#000', border:'none', borderRadius:10, padding:'8px 16px', cursor:'pointer', fontSize:13, fontWeight:600 }}>+</button>
          </div>
        )}
        {hot.length>0 && (
          <div style={{ marginBottom:8 }}>
            <SectionTitle color='#e74c3c'>⚡ Imminent — Cette semaine (≤ 7 jours)</SectionTitle>
            {hot.map(e=><EventCard key={e.id} e={e} onAdd={onAddToAgenda} />)}
          </div>
        )}
        {rest.length>0 && (
          <div>
            <SectionTitle>📅 Prochainement</SectionTitle>
            {rest.map(e=><EventCard key={e.id} e={e} onAdd={onAddToAgenda} />)}
          </div>
        )}
        {filtered.length===0 && (
          <div style={{ textAlign:'center', padding:'40px 20px', color:'#8b949e' }}>
            <div style={{ fontSize:40, marginBottom:10 }}>🔍</div>
            <div>Activez des centres d'intérêt pour voir les événements</div>
          </div>
        )}
      </div>
    </div>
  );
};

    <div style={{
      background:'#161b22', border:`1px solid ${e.hot?'#e74c3c':'#30363d'}`,

            <button onClick={openSource} style={{
              background:'#0d2a3e', border:'1px solid #30363d', color:'#58a6ff',
              borderRadius:6, padding:'3px 8px', cursor:'pointer', fontSize:11, fontWeight:600,

            }}>🔗 Source</button>

        }}>

          <button onClick={openSource} style={{
            background:'#0d2a3e', border:'1px solid #58a6ff', color:'#58a6ff',
            borderRadius:8, padding:'8px 12px', cursor:'pointer', fontSize:16, flexShrink:0

};

// AGENDA TAB — 15 jours, swipe, calendrier
// ═══════════════════════════════════════════════════════
const AgendaTab = ({ agendaItems, eventsDb }) => {
  // "Aujourd'hui" normalisé à minuit
  const todayNorm = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

  const [selDate,  setSelDate]  = useState(new Date(todayNorm));
  const [showCal,  setShowCal]  = useState(false);
  const [calMonth, setCalMonth] = useState(new Date(todayNorm));

  const touchX    = useRef(null);
  const stripRef  = useRef(null);
  const selBtnRef = useRef(null);

  // Générer 15 jours à partir d'aujourd'hui
  const days15 = Array.from({ length:15 }, (_,i) => {
    const d = new Date(todayNorm);
    d.setDate(todayNorm.getDate() + i);
    return d;
  });

  // Auto-scroll la bande de jours vers le jour sélectionné
  useEffect(() => {
    if (selBtnRef.current && stripRef.current) {
      selBtnRef.current.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    }
  }, [selDate.toDateString()]);

  // ── Résolution date d'un item agenda
  const getItemDate = (item) => {
    if (item.dateStr) return new Date(item.dateStr);
    // day 1=Lun … 7=Dim de la semaine courante
    const d = WEEK_DATES_OBJ[item.day - 1];
    return d || null;
  };

  const itemsForDate = (date) => agendaItems.filter(item => {
    const d = getItemDate(item);
    return d && isSameDay(d, date);
  });

  const dayItems = itemsForDate(selDate);

  // ── Swipe gauche/droite sur le contenu
  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 45) {
      const next = new Date(selDate);
      next.setDate(selDate.getDate() + (dx < 0 ? 1 : -1));
      // Ne pas aller avant aujourd'hui
      if (next.getTime() >= todayNorm.getTime()) setSelDate(next);
      else setSelDate(new Date(todayNorm));
    }
    touchX.current = null;
  };

  // ── Flèches gauche/droite dans l'en-tête
  const prevDay = () => {
    const d = new Date(selDate);
    d.setDate(d.getDate() - 1);
    if (d.getTime() >= todayNorm.getTime()) setSelDate(d);

  const nextDay = () => {
    const d = new Date(selDate);
    d.setDate(d.getDate() + 1);
    setSelDate(d);
  };

  // ── Suggestions du jour
  const suggestions = [
    { time:'08:00', icon:'📊', text:'Backtesting Python 30min',       cat:'Trading' },
    { time:'10:00', icon:'📚', text:'Lire 30min (Épicure / Deleuze)', cat:'Culture' },
    { time:'12:00', icon:'🥗', text:'Déjeuner sain — objectif poids', cat:'Santé'   },
    { time:'14:30', icon:'🧘', text:'Étirements 10min',                cat:'Santé'   },
    { time:'16:00', icon:'📞', text:'Appel / SMS enfants',             cat:'Famille' },
    { time:'20:30', icon:'📖', text:'1 manga ou lecture',              cat:'Culture' },

  const occupiedTimes  = dayItems.map(i => i.time);
  const freeSuggestions = suggestions.filter(s => !occupiedTimes.includes(s.time));

  // ── Label du jour sélectionné

  const selLabel = `${DAYS_FR[selDow].charAt(0).toUpperCase()+DAYS_FR[selDow].slice(1)} ${selDate.getDate()} ${MONTHS_FR[selDate.getMonth()]} ${selDate.getFullYear()}`;
  const isSelToday = isSameDay(selDate, todayNorm);

  // ════════════════════════
  // Calendrier mensuel modal
  // ════════════════════════

    const [localMonth, setLocalMonth] = useState(new Date(calMonth));

    const mo  = localMonth.getMonth();

                  aspectRatio:'1', borderRadius:8, border:'none', cursor:'pointer',

                  fontSize:13, fontWeight: isT||isSel?700:400,

                    <div style={{ width:4, height:4, borderRadius:'50%',
                      background: isSel?'#fff':'#58a6ff', flexShrink:0 }} />

                </button>

          </div>

          {/* Bouton fermer */}
          <button onClick={()=>setShowCal(false)} style={{
            width:'100%', marginTop:18, background:'#21262d', border:'1px solid #30363d',
            color:'#f0f0f0', borderRadius:10, padding:12, cursor:'pointer', fontSize:14, fontWeight:600
          }}>Fermer</button>
        </div>
      </div>
    );
  };

  // ════════════ RENDER ════════════
  return (
    <div className="slide-up">
      {/* En-tête */}
      <div style={{ background:'linear-gradient(135deg,#1a1a2e,#16213e)', padding:'24px 20px 14px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontSize:28, fontWeight:700, marginBottom:2 }}>📅 Agenda</div>
            <div style={{ fontSize:13, color:'#8b949e' }}>15 prochains jours</div>
          </div>
          {/* Icône calendrier complet */}
          <button onClick={()=>setShowCal(true)} style={{
            background:'#21262d', border:'1px solid #30363d', color:'#58a6ff',
            borderRadius:10, padding:'8px 12px', cursor:'pointer', fontSize:13,
            display:'flex', alignItems:'center', gap:6, fontWeight:600
          }}>
            🗓️ <span style={{ fontSize:11 }}>Calendrier</span>
          </button>
        </div>
      </div>

      {/* Bande 15 jours scrollable */}
      <div ref={stripRef} style={{
        display:'flex', padding:'10px 14px 8px', gap:6,
        overflowX:'auto', WebkitOverflowScrolling:'touch'
      }}>
        {days15.map((d,i) => {
          const isT   = isSameDay(d, todayNorm);
          const isSel = isSameDay(d, selDate);
          const hasIt = agendaItems.some(item => { const id=getItemDate(item); return id&&isSameDay(id,d); });
          const dow   = d.getDay() === 0 ? 6 : d.getDay() - 1; // 0=Lun
          return (
            <button
              key={i}
              ref={isSel ? selBtnRef : null}
              onClick={()=>setSelDate(new Date(d))}
              style={{
                flex:'0 0 auto', display:'flex', flexDirection:'column', alignItems:'center',
                padding:'8px 10px', borderRadius:12, border:'none', cursor:'pointer', minWidth:50,
                background: isSel?'#58a6ff': isT?'#1a3a5c':'#161b22',
                color: isSel?'#fff': isT?'#58a6ff':'#8b949e', transition:'all 0.2s'
              }}>
              <div style={{ fontSize:10, marginBottom:2 }}>{WEEK_DAYS[dow]}</div>
              <div style={{ fontSize:18, fontWeight:700 }}>{d.getDate()}</div>
              <div style={{ fontSize:9, color: isSel?'rgba(255,255,255,0.7)': '#8b949e', marginBottom:2 }}>
                {MONTHS_FR[d.getMonth()].slice(0,3)}
              </div>
              {hasIt
                ? <div style={{ width:5, height:5, borderRadius:'50%', background: isSel?'#fff':'#58a6ff' }} />
                : <div style={{ width:5, height:5 }} />
              }
            </button>

        })}
        {/* Bouton "…plus" pour aller au-delà des 15 jours */}
        <button onClick={()=>setShowCal(true)} style={{
          flex:'0 0 auto', display:'flex', flexDirection:'column', alignItems:'center',
          justifyContent:'center', padding:'8px 12px', borderRadius:12, minWidth:44,
          background:'#161b22', border:'1px dashed #30363d', color:'#8b949e', cursor:'pointer'
        }}>
          <span style={{ fontSize:18 }}>›</span>
          <span style={{ fontSize:9 }}>plus</span>

      </div>

      {/* Contenu du jour — swipeable */}
      <div
        onTouchStart={onTouchStart}
        onTouchEnd={onTouchEnd}
        style={{ padding:'8px 20px 20px', userSelect:'none' }}
      >
        {/* Titre + flèches de navigation */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
          <button onClick={prevDay} disabled={isSelToday} style={{

          <button onClick={nextDay} style={{

        {/* Événements planifiés */}

          <>

        {/* Prochains événements Sentinelle */}

          <SectionTitle>🔭 Événements Sentinelle proches</SectionTitle>

// ═══════════════════════════════════════════════════════
// PERSISTANCE — localStorage
// Les données survivent aux rechargements de page et aux
// changements d'onglet. Les habitudes se remettent à zéro
// chaque nouveau jour (streak conservé).
// ═══════════════════════════════════════════════════════
const LS = {
  GOALS:      'regis_goals_2026',
  HABITS:     'regis_habits_2026',
  HAB_DATE:   'regis_habits_date_2026',
  INTERESTS:  'regis_interests_2026',
  URGENT:     'regis_urgent_done_2026',
  GOAL_NOTES: 'regis_goal_notes_2026',
};

const lsGet = (key, fallback) => {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
  catch { return fallback; }
};
const lsSet = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} };

// Charge les habitudes : reset si nouveau jour, merge intelligent (gère les ajouts/suppressions)
const initHabits = () => {
  const today = new Date().toDateString();
  const savedDate = localStorage.getItem(LS.HAB_DATE) || '';
  const saved = lsGet(LS.HABITS, null);
  if (!saved || savedDate !== today) {
    // Nouveau jour OU première fois : base HABITS_INIT, done=false
    return HABITS_INIT.map(h => ({ ...h, done: false }));
  }
  // Merge : ne garder que les habits existant dans HABITS_INIT (gère les suppressions)
  return HABITS_INIT.map(h => {
    const s = saved.find(sh => sh.id === h.id);
    return s ? { ...h, done: s.done, streak: s.streak } : h;
  });
};

// Charge les goals : merge intelligent (préserve cur, gère les ajouts/suppressions)
const initGoals = () => {
  const saved = lsGet(LS.GOALS, null);
  if (!saved) return GOALS_INIT;
  return GOALS_INIT.map(g => {
    const s = saved.find(sg => sg.id === g.id);
    return s ? { ...g, cur: s.cur } : g; // nouveau goal → cur par défaut
  });
};

const initUrgentDone = () => new Set(lsGet(LS.URGENT, []));
const initGoalNotes = () => lsGet(LS.GOAL_NOTES, {});

// ═══════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════
// ── Mapping Sentinelle → Objectif lié (auto-incrément)
// int = catégorie d'intérêt Sentinelle → goalId dans GOALS_INIT
const SENTINEL_GOAL_MAP = {
  philo:   19,  // → 12 sorties culturelles
  music:   19,  // → 12 sorties culturelles
  theatre: 19,  // → 12 sorties culturelles
  socio:   19,  // → 12 sorties culturelles
  squash:  null,
  famille: null,
  kite:    null,
};

const App = () => {
  const [tab,       setTab]       = useState('today');
  const [habits,    setHabits]    = useState(initHabits);
  const [goals,     setGoals]     = useState(initGoals);
  const [interests, setInterests] = useState(() => lsGet(LS.INTERESTS, INTERESTS_INIT));
  const [agenda,    setAgenda]    = useState(AGENDA_INIT);
  const [urgentDone, setUrgentDone] = useState(initUrgentDone);
  const [goalNotes, setGoalNotes] = useState(initGoalNotes);
  const [toast,     setToast]     = useState(null); // { msg, goalName }
  const [eventsDb]  = useState(EVENTS_FALLBACK);
  const [eventsSource] = useState('sync HTML Claude');

  // ── Auto-save à chaque changement d'état ──
  useEffect(() => { lsSet(LS.GOALS, goals); }, [goals]);
  useEffect(() => {
    lsSet(LS.HABITS, habits);
    localStorage.setItem(LS.HAB_DATE, new Date().toDateString());
  }, [habits]);
  useEffect(() => { lsSet(LS.INTERESTS, interests); }, [interests]);
  useEffect(() => { lsSet(LS.URGENT, [...urgentDone]); }, [urgentDone]);
  useEffect(() => { lsSet(LS.GOAL_NOTES, goalNotes); }, [goalNotes]);

  // ── Toast auto-disparaît après 3s ──
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3500);
    return () => clearTimeout(t);
  }, [toast]);

  const toggleHabit = (id) => {
    const habit = habits.find(h => h.id === id);
    if (!habit) return;
    const checking = !habit.done; // true = on coche, false = on décoche
    setHabits(h => h.map(x => x.id===id ? {...x, done:!x.done} : x));
    // Si l'habitude est liée à un objectif, incrémenter / décrémenter
    if (habit.goalId) {
      setGoals(prev => prev.map(g => {
        if (g.id !== habit.goalId) return g;
        const delta = checking ? 1 : -1;
        return { ...g, cur: Math.max(0, Math.min(g.tgt, g.cur + delta)) };
      }));
    }
  };

  const toggleUrgent = (id) => {
    setUrgentDone(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const getExportSnapshot = () => ({
    exportedAt: new Date().toISOString(),
    goals,
    goalNotes,
    habits,
    interests,
    agenda,
    urgentDone: [...urgentDone],
    events: eventsDb,
  });

  const exportAppData = (format) => {
    const stamp = new Date().toISOString().slice(0, 10);
    const snapshot = getExportSnapshot();

    if (format === 'json') {
      downloadFile(`regis-goals-${stamp}.json`, JSON.stringify(snapshot, null, 2), 'application/json;charset=utf-8');
      return;
    }

    if (format === 'csv') {
      const rows = [
        ['id', 'categorie', 'objectif', 'progression', 'cible', 'unite', 'priorite', 'trim', 'note'],
        ...goals.map(g => [
          g.id,
          g.cat,
          g.name,
          g.cur,
          g.tgt,
          g.unit,
          g.pond,
          g.trim,
          goalNotes[g.id] || '',
        ]),
      ];
      const csv = rows.map(row => row.map(escapeCsv).join(';')).join('\n');
      downloadFile(`regis-goals-${stamp}.csv`, csv, 'text/csv;charset=utf-8');
      return;
    }

    if (format === 'xls') {
      const goalsRows = goals.map(g => `
        <tr>
          <td>${g.id}</td>
          <td>${g.cat}</td>
          <td>${g.name}</td>
          <td>${g.cur}</td>
          <td>${g.tgt}</td>
          <td>${g.unit}</td>
          <td>${g.pond}</td>
          <td>${g.trim}</td>
          <td>${(goalNotes[g.id] || '').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>')}</td>
        </tr>`).join('');
      const habitsRows = habits.map(h => `
        <tr><td>${h.id}</td><td>${h.name}</td><td>${h.cat}</td><td>${h.done ? 'oui' : 'non'}</td><td>${h.streak}</td></tr>`).join('');
      const agendaRows = agenda.map(a => `
        <tr><td>${a.title}</td><td>${a.cat}</td><td>${a.time}</td><td>${a.dur}</td><td>${a.dateStr || a.day || ''}</td></tr>`).join('');
      const html = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
        <table border="1">
          <tr><th colspan="9">Objectifs</th></tr>
          <tr><th>ID</th><th>Catégorie</th><th>Objectif</th><th>Progression</th><th>Cible</th><th>Unité</th><th>Priorité</th><th>Trim</th><th>Note</th></tr>
          ${goalsRows}
        </table>
        <br>
        <table border="1">
          <tr><th colspan="5">Habitudes</th></tr>
          <tr><th>ID</th><th>Nom</th><th>Catégorie</th><th>Fait</th><th>Streak</th></tr>
          ${habitsRows}
        </table>
        <br>
        <table border="1">
          <tr><th colspan="5">Agenda</th></tr>
          <tr><th>Titre</th><th>Catégorie</th><th>Heure</th><th>Durée</th><th>Date/Jour</th></tr>
          ${agendaRows}
        </table>
      </body></html>`;
      downloadFile(`regis-goals-${stamp}.xls`, html, 'application/vnd.ms-excel;charset=utf-8');
    }
  };

  const addEventToAgenda = (ev) => {
    // 1. Ajouter à l'agenda
    setAgenda(prev => [...prev, {
      id: Date.now(), time: '19:00', dur: 120,
      cat: 'Culture', title: ev.title, emoji: ev.type,
      fromSentinel: true, dateStr: ev.date
    }]);

    // 2. Auto-incrémenter l'objectif lié si applicable
    const linkedId = SENTINEL_GOAL_MAP[ev.int];
    if (linkedId) {
      // Lire l'objectif depuis l'état courant AVANT la mise à jour
      const linkedGoal = goals.find(g => g.id === linkedId);
      if (linkedGoal) {
        const newCur = Math.min(linkedGoal.cur + 1, linkedGoal.tgt);
        setGoals(prev => prev.map(g => g.id === linkedId ? {...g, cur: newCur} : g));
        // Toast séparé du setGoals pour éviter les effets de bord React
        setToast({ goalName: linkedGoal.name, cur: newCur, tgt: linkedGoal.tgt });
      }
    }

    setTab('agenda');
  };

  const TABS = [
    { id:'today',    icon:'🌅', label:"Aujourd'hui" },
    { id:'goals',    icon:'🎯', label:'Objectifs'   },
    { id:'sentinel', icon:'🔭', label:'Sentinelle'  },
    { id:'agenda',   icon:'📅', label:'Agenda'      },
  ];

  return (
    <div style={{
      minHeight:'100vh', maxWidth:440,
      margin:'0 auto', position:'relative', padding:'12px 12px 96px'
    }}>
      <div style={{
        minHeight:'calc(100vh - 24px)',
        background:'linear-gradient(180deg, rgba(255,255,255,0.76), rgba(255,255,255,0.46))',
        border:'1px solid rgba(255,255,255,0.88)',
        borderRadius:34,
        overflow:'hidden',
        boxShadow:'0 28px 80px rgba(23,32,49,0.14)',
        backdropFilter:'blur(18px)',
        position:'relative'
      }}>
        <div style={{
          position:'absolute', top:12, left:'50%', transform:'translateX(-50%)',
          width:110, height:24, borderRadius:999, background:'rgba(17,24,39,0.88)', zIndex:20
        }} />
        <div style={{
          minHeight:'calc(100vh - 24px)',
          background:'linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 100%)'
        }}>
          {tab==='today'    && <TodayTab    habits={habits} goals={goals} toggleHabit={toggleHabit} urgentDone={urgentDone} toggleUrgent={toggleUrgent} onExport={exportAppData} />}
          {tab==='goals'    && <GoalsTab    goals={goals} setGoals={setGoals} goalNotes={goalNotes} setGoalNotes={setGoalNotes} />}
          {tab==='sentinel' && <SentinelTab interests={interests} setInterests={setInterests} onAddToAgenda={addEventToAgenda} eventsDb={eventsDb} eventsSource={eventsSource} />}
          {tab==='agenda'   && <AgendaTab   agendaItems={agenda} setAgenda={setAgenda} eventsDb={eventsDb} />}
        </div>
      </div>

      {/* Toast — notification Sentinelle → Objectif */}
      {toast && (
        <div className="slide-up" style={{
          position:'fixed', bottom:96, left:'50%', transform:'translateX(-50%)',
          background:'rgba(255,255,255,0.88)', border:'1px solid rgba(255,255,255,0.94)', borderRadius:18,
          padding:'12px 16px', zIndex:200,
          display:'flex', alignItems:'center', gap:10,
          boxShadow:'0 18px 42px rgba(23,32,49,0.18)',
          maxWidth:360, width:'calc(100% - 40px)'
        }}>
          <span style={{ fontSize:24 }}>🎯</span>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:13, fontWeight:800, color:'#2ecc71' }}>
              +1 sortie culturelle enregistrée !
            </div>
            <div style={{ fontSize:11, color:'var(--muted)', marginTop:2 }}>
              {toast.goalName} → {toast.cur}/{toast.tgt}
            </div>
          </div>
          <button onClick={()=>setToast(null)} style={{
            background:'none', border:'none', color:'var(--muted)', fontSize:18, cursor:'pointer'
          }}>✕</button>
        </div>
      )}

      {/* Navigation bas */}
      <nav style={{
        position:'fixed', bottom:12, left:'50%', transform:'translateX(-50%)',
        width:'min(416px, calc(100vw - 24px))',
        background:'rgba(255,255,255,0.76)', backdropFilter:'blur(18px)',
        border:'1px solid rgba(255,255,255,0.84)', borderRadius:24,
        display:'flex', padding:'8px', zIndex:100, boxShadow:'0 18px 40px rgba(23,32,49,0.14)'
      }}>
        {TABS.map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            flex:1, background: tab===t.id ? 'var(--navy)' : 'transparent', border:'none', cursor:'pointer',
            display:'flex', flexDirection:'column', alignItems:'center', gap:3,
            color: tab===t.id ? '#fff' : 'var(--muted)', transition:'all 0.2s',
            borderRadius:18, padding:'8px 0'
          }}>
            <span style={{ fontSize:22, transform: tab===t.id?'scale(1.06)':'scale(1)', transition:'transform 0.2s' }}>{t.icon}</span>
            <span style={{ fontSize:10, fontWeight: tab===t.id?800:700 }}>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
